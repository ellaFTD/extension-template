name: Actualizar datos de Samsara
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "Coast_Spend_Report*.xlsx"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Procesar reportes de combustible (Coast)
        run: |
          if ls Coast_Spend_Report*.xlsx >/dev/null 2>&1; then
            pip install pandas openpyxl
            python process_fuel.py
          fi
      - run: python fetch_samsara.py
        env:
          SAMSARA_TOKEN: ${{ secrets.SAMSARA_TOKEN }}
      - run: |
          git config user.name "fleet-bot"
          git config user.email "fleet-bot@users.noreply.github.com"
          git add data.json history.json fuel.json
          git diff --cached --quiet || (git commit -m "Actualizar datos" && git push)
